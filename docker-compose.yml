version: '3.8'

services:
  api:
    build: .
    container_name: ai_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  frontend:
    image: python:3.11-slim
    container_name: ai_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    working_dir: /app
    # This command installs the necessary libraries and starts the UI
    command: sh -c "pip install streamlit requests && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api
